{% extends "bases/barber_base.html" %}

{% block title %}Barber Dashboard{% endblock %}

{% block content %}

<h1 class="mb-3"><strong>Barber Dashboard</strong></h1>

<p class="h5 mb-5">
    Welcome, Barber <span style="color: green;"><strong>{{ firstName }}</strong></span>!
</p>

<div class="row justify-content-center">

    <div class="col-md-4 d-flex justify-content-center mb-4">
        <a href="/view_schedule" class="dashboard-button">
            View My Schedule
        </a>
    </div>

    <div class="col-md-4 d-flex justify-content-center mb-4">
        <a href="/block_time_slots" class="dashboard-button">
            Block Time Slots For Unavailability
        </a>
    </div>

    <div class="col-md-4 d-flex justify-content-center mb-4">
        <a href="/basic_revenue_view" class="dashboard-button">
            Basic Revenue View
        </a>
    </div>

</div>

{% if is_admin %}
<div class="row justify-content-center mt-4">
    <div class="col-md-4 d-flex justify-content-center mb-4">
        <a href="/admin_dashboard" class="admin-dashboard-button">
            Go to Admin Dashboard
        </a>
    </div>
</div>
{% endif %}

<style>
    .dashboard-button {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        white-space: normal;
        padding: 0 20px;

        width: 100%;
        height: 200px;

        background-color: #00b140;
        color: black;

        font-size: 32px;
        font-weight: 500;
        text-decoration: none;

        border-radius: 6px;
        transition: 0.15s ease-in-out;
    }

    .dashboard-button:hover {
        background-color: #009b38;
        color: white;
        text-decoration: none;
    }

    .admin-dashboard-button {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        white-space: normal;
        padding: 0 20px;

        width: 100%;
        height: 200px;

        background-color: #d9534f;
        color: white;

        font-size: 32px;
        font-weight: 500;
        text-decoration: none;

        border-radius: 6px;
        transition: 0.15s ease-in-out;
    }

    .admin-dashboard-button:hover {
        background-color: #c9302c;
        color: white;
        text-decoration: none;
    }
</style>

{% endblock %}
